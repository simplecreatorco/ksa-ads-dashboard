function openSettings() {
  if (!STATE.activeClient) {
    showToast('Select a client first');
    return;
  }

  const client = STATE.activeClient;
  const data = STATE.cache[client.slug];
  const config = data ? data.config : [];
  const offers = data ? data.offers : [];

  // Group products by offer
  const offerProducts = {};
  config.forEach(c => {
    const offer = c['Offer Name'];
    if (!offerProducts[offer]) offerProducts[offer] = [];
    offerProducts[offer].push(c);
  });

  // Sort each offer's products by Position
  Object.values(offerProducts).forEach(prods => {
    prods.sort((a, b) => parseInt(a['Position'] || 0) - parseInt(b['Position'] || 0));
  });

  let html = `
    <div class="settings-title">Client Settings</div>

    <div class="settings-section">
      <div class="settings-label">Client Name</div>
      <input class="settings-input" id="settings-client-name" value="${escapeAttr(client.name)}">

      <div class="settings-label">Slug</div>
      <input class="settings-input" id="settings-slug" value="${escapeAttr(client.slug)}" readonly>

      <div class="settings-label">Meta Account ID</div>
      <input class="settings-input" id="settings-meta-ids" value="${escapeAttr(client.metaIds)}">

      <button class="ksa-btn" onclick="saveClientSettings()" style="margin-top:4px;">Save Client</button>
    </div>

    <div class="settings-section">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <div class="settings-title" style="margin-bottom:0;">Offers</div>
        <button class="small-btn small-btn-pink" onclick="openAddOffer()">+ Add Offer</button>
      </div>

      ${offers.map(offerName => {
        const products = offerProducts[offerName] || [];
        return `
          <div class="offer-block" data-offer-name="${escapeAttr(offerName)}">
            <div class="offer-block-header">
              <div style="display:flex;align-items:center;gap:2px;">
                <span class="offer-drag" title="Drag to reorder">&#9776;</span>
                <div class="offer-block-name">
                  ${escapeHtml(offerName)}
                  <button class="edit-icon-btn" onclick="openRenameOffer('${escapeAttr(offerName)}')" title="Rename offer">&#9998;</button>
                </div>
              </div>
              <div class="offer-block-actions">
                <button class="small-btn small-btn-outline" onclick="openAddUpsell('${escapeAttr(offerName)}')">+ Add Upsell</button>
              </div>
            </div>
            ${products.map((p, idx) => {
              const ptype = productType(p);
              const pname = productDisplayName(p);
              const displayName = pname ? `${escapeHtml(ptype)} <span style="opacity:0.5;font-weight:400;">— ${escapeHtml(pname)}</span>` : escapeHtml(ptype);
              return `
              <div class="product-row" data-offer="${escapeAttr(offerName)}" data-position="${idx}" data-product-label="${escapeAttr(pname)}">

                <span class="product-name" data-product-name="${escapeAttr(ptype)}">${displayName}</span>
                <span class="product-price">${formatCurrency(parseNum(p['Current Price']))}</span>
                <button class="product-price-btn" onclick="openChangePrice('${escapeAttr(offerName)}', '${escapeAttr(ptype)}', '${escapeAttr(p['Current Price'])}')">Change</button>
                <button class="product-price-btn" onclick="openEditProductName('${escapeAttr(offerName)}', '${escapeAttr(ptype)}', '${escapeAttr(pname)}')">Name</button>

function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('show');
  document.getElementById('settings-panel').classList.remove('open');
}

function setupProductDragDrop() {
  const dragHandles = document.querySelectorAll('.product-drag');
  let draggedRow = null;

  dragHandles.forEach(handle => {
    const row = handle.parentElement;
    row.draggable = true;

    row.addEventListener('dragstart', (e) => {
      draggedRow = row;
      row.style.opacity = '0.5';
      e.dataTransfer.effectAllowed = 'move';
    });

    row.addEventListener('dragend', () => {
      row.style.opacity = '1';
      draggedRow = null;
    });

    row.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    });

    row.addEventListener('drop', (e) => {
      e.preventDefault();
      if (!draggedRow || draggedRow === row) return;

      const parent = row.parentElement;
      const rows = [...parent.querySelectorAll('.product-row')];
      const dragIndex = rows.indexOf(draggedRow);
      const dropIndex = rows.indexOf(row);

      if (dragIndex < dropIndex) {
        parent.insertBefore(draggedRow, row.nextSibling);
      } else {
        parent.insertBefore(draggedRow, row);
      }

      // Save new order
      const offerName = row.dataset.offer;
      saveProductOrder(offerName);
    });
  });
}

async function saveProductOrder(offerName) {
  const rows = document.querySelectorAll(`.product-row[data-offer="${offerName}"]`);
  const products = [];
  rows.forEach((row, i) => {
    const nameEl = row.querySelector('.product-name');
    const productName = nameEl.dataset.productName || nameEl.textContent.trim();
    products.push({
      name: productName,
      position: i + 1,
      currentPrice: row.querySelector('.product-price').textContent.trim().replace('$', '').replace(',', ''),
      active: 'Yes',
      label: row.dataset.productLabel || ''
    });
  });

  // Save the new position order first (silent — show one toast at end)
  const orderResult = await postToWebApp('save_config', {
    clientSlug: STATE.activeClient.slug,
    offerName,
    products
  }, true);

  if (!orderResult) return; // error already shown

  // Auto-rename products based on new position:
  // Position 1 = keep existing name (main offer)
  // Position 2 = "Bump"
  // Position 3+ = "Upsell 1", "Upsell 2", etc.
  const renamePromises = [];
  let upsellCounter = 0;
  for (let i = 0; i < products.length; i++) {
    const p = products[i];
    let expectedName = null;

    if (i === 0) {
      continue; // Position 1: keep existing name (main offer / tripwire)
    } else if (i === 1) {
      expectedName = 'Bump';
    } else {
      upsellCounter++;
      expectedName = 'Upsell ' + upsellCounter;
    }

    if (expectedName && p.name !== expectedName) {
      renamePromises.push(
        postToWebApp('rename_product', {
          clientSlug: STATE.activeClient.slug,
          offerName,
          oldProductName: p.name,
          newProductName: expectedName
        }, true) // silent
      );
    }
  }

  if (renamePromises.length > 0) {
    await Promise.all(renamePromises);
    showToast('Reordered and renamed');
  } else {
    showToast('Order saved');
  }

  // Refresh client data
  await fetchClientData(STATE.activeClient.slug);
  openSettings(); // Refresh the settings panel to show updated names
}

function setupOfferDragDrop() {
  const blocks = document.querySelectorAll('.offer-block');
  let draggedBlock = null;

  blocks.forEach(block => {
    const handle = block.querySelector('.offer-drag');
    if (!handle) return;

    handle.addEventListener('mousedown', () => { block.draggable = true; });
    handle.addEventListener('mouseup', () => { block.draggable = false; });

    block.addEventListener('dragstart', (e) => {
      draggedBlock = block;
      block.style.opacity = '0.45';
      e.dataTransfer.effectAllowed = 'move';
    });

    block.addEventListener('dragend', () => {
      block.style.opacity = '1';
      block.draggable = false;
      draggedBlock = null;
      document.querySelectorAll('.offer-block').forEach(b => b.classList.remove('drag-over'));
    });

    block.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('.offer-block').forEach(b => b.classList.remove('drag-over'));
      if (draggedBlock && draggedBlock !== block) block.classList.add('drag-over');
    });

    block.addEventListener('drop', (e) => {
      e.preventDefault();
      block.classList.remove('drag-over');
      if (!draggedBlock || draggedBlock === block) return;

      const parent = block.parentElement;
      const allBlocks = [...parent.querySelectorAll('.offer-block')];
      const dragIdx = allBlocks.indexOf(draggedBlock);
      const dropIdx = allBlocks.indexOf(block);

      if (dragIdx < dropIdx) {
        parent.insertBefore(draggedBlock, block.nextSibling);
      } else {
        parent.insertBefore(draggedBlock, block);
      }

      saveOfferOrder();
    });
  });
}

async function saveOfferOrder() {
  const blocks = document.querySelectorAll('.offer-block');
  const offerOrder = [...blocks].map(b => b.dataset.offerName);
  const result = await postToWebApp('reorder_offers', {

async function submitAddOffer() {
  const offerName = document.getElementById('modal-offer-name').value.trim();
  if (!offerName) { showToast('Enter an offer name'); return; }

  const typeVal = document.getElementById('modal-offer-type').value;
  const isIG = typeVal === 'ig';
  const isLeadFunnel = typeVal === 'lead';
  const offerType = isIG ? 'IG Profile Visits' : isLeadFunnel ? 'Lead Funnel' : 'Product Funnel';

  // IG Profile Visits has no products
  if (isIG) {
    closeModal();
    await postToWebApp('setup_new_offer', { clientSlug: STATE.activeClient.slug, offerName, offerType, funnelLength: 0, products: [] });
    await fetchClientData(STATE.activeClient.slug);
    openSettings();
    return;
  }

  const mainName = document.getElementById('modal-main-name').value.trim();
  const mainPrice = parseFloat(document.getElementById('modal-main-price').value);
  if (!mainName) { showToast('Enter a main offer product name'); return; }
  if (isNaN(mainPrice)) { showToast('Enter a main offer price'); return; }

  const products = [];
  let bumpPosition, upsellStartPosition, funnelLength = 0;

  if (isLeadFunnel) {
    const freebieName = document.getElementById('modal-freebie-name').value.trim();
    const freebiePrice = parseFloat(document.getElementById('modal-freebie-price').value) || 0;
    funnelLength = parseInt(document.getElementById('modal-funnel-length').value) || 0;
    if (!freebieName) { showToast('Enter a freebie product name'); return; }
    products.push({ name: freebieName, position: 1, price: freebiePrice, label: '' });
    products.push({ name: mainName, position: 2, price: mainPrice, label: '' });
    bumpPosition = 3;
    upsellStartPosition = 4;
  } else {
    products.push({ name: mainName, position: 1, price: mainPrice, label: '' });
    bumpPosition = 2;
    upsellStartPosition = 3;
  }

  const bumpLabel = (document.getElementById('modal-bump-label').value || '').trim();
  const bumpPrice = parseFloat(document.getElementById('modal-bump-price').value);
  if (!isNaN(bumpPrice) && bumpPrice > 0) {
    products.push({ name: 'Bump', position: bumpPosition, price: bumpPrice, label: bumpLabel });
  }

  const upsellRows = document.querySelectorAll('.modal-upsell-row');
  let upsellNum = 1;
  upsellRows.forEach(row => {
    const priceInput = row.querySelector('[data-upsell-price]');
    const labelInput = row.querySelector('[data-upsell-label]');
    const price = parseFloat(priceInput ? priceInput.value : '');
    if (!isNaN(price) && price > 0) {
      const label = (labelInput ? labelInput.value || '' : '').trim();
      products.push({ name: 'Upsell ' + upsellNum, position: upsellStartPosition + upsellNum - 1, price, label });
      upsellNum++;
    }
  });

  closeModal();
  await postToWebApp('setup_new_offer', { clientSlug: STATE.activeClient.slug, offerName, offerType, funnelLength, products });
  await fetchClientData(STATE.activeClient.slug);
  openSettings();
}

function openAddUpsell(offerName) {
  // Auto-determine the next upsell number
  const data = STATE.cache[STATE.activeClient.slug];
  const existingProducts = (data.config || [])
    .filter(c => c['Offer Name'] === offerName)
    .sort((a, b) => parseInt(a['Position'] || 0) - parseInt(b['Position'] || 0));

  // Count existing upsells (position 3+)
  const upsellCount = existingProducts.filter(p => parseInt(p['Position'] || 0) >= 3).length;
  const nextUpsellNum = upsellCount + 1;
  const upsellName = 'Upsell ' + nextUpsellNum;

  const html = `
    <div class="modal-title">Add Upsell to ${escapeHtml(offerName)}</div>

    <div class="modal-label">${escapeHtml(upsellName)} — Price</div>
    <input class="modal-input" id="modal-upsell-price" type="number" step="0.01" placeholder="e.g. 47">

    <div class="modal-label">Product Name <span style="opacity:0.5;font-weight:400;">(optional)</span></div>
    <input class="modal-input" id="modal-upsell-label" placeholder="e.g. Lighting Preset Pack">

    <div class="modal-actions">
      <button class="ksa-btn-outline" onclick="closeModal()">Cancel</button>
      <button class="ksa-btn" onclick="submitAddUpsell('${escapeAttr(offerName)}', '${escapeAttr(upsellName)}')">Add Upsell</button>
    </div>
  `;
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

async function submitAddUpsell(offerName, upsellName) {
  const price = parseFloat(document.getElementById('modal-upsell-price').value);
  if (isNaN(price)) { showToast('Enter a price'); return; }

  const upsellLabel = (document.getElementById('modal-upsell-label').value || '').trim();

  const data = STATE.cache[STATE.activeClient.slug];
  const existingProducts = (data.config || [])
    .filter(c => c['Offer Name'] === offerName)
    .sort((a, b) => parseInt(a['Position'] || 0) - parseInt(b['Position'] || 0));

  const newPosition = existingProducts.length + 1;

  const products = existingProducts.map(p => ({
    name: productType(p),
    position: parseInt(p['Position']),
    currentPrice: p['Current Price'],
    active: p['Active'],
    label: productDisplayName(p)
  }));

  products.push({
    name: upsellName,
    position: newPosition,
    currentPrice: price.toString(),
    active: 'Yes',
    label: upsellLabel
  });

  const r1 = await postToWebApp('save_config', {
    clientSlug: STATE.activeClient.slug,
    offerName,
    products
  }, true); // silent — don't toast yet

  if (!r1) return; // error already shown

  // Add to price history (shows the single "Saved" toast)
  const r2 = await postToWebApp('save_price_change', {
    clientSlug: STATE.activeClient.slug,
    offerName,
    productName: upsellName,
    newPrice: price,
    effectiveDate: dateStr(new Date())
  });

  if (!r2) return;

  closeModal();
  await fetchClientData(STATE.activeClient.slug);
  openSettings();
}

            <th style="font-family:var(--font-label);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ksa-orange);text-align:right;padding-bottom:8px;font-weight:400;">Revenue</th>
            <th style="width:30px;"></th>
          </tr>
        </thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>`;
}

function renderPurchaseLog(offerName, configProducts, purchaseData) {
  if (configProducts.length === 0) return '';

  const productNames = configProducts.map(p => productType(p));
  const PAGE_SIZE = 15;

  // Sort purchase data by date descending (most recent first) using normalized dates
  const sorted = [...purchaseData].sort((a, b) => {
    const da = normalizeDateStr(a['Date'] || '');
    const db = normalizeDateStr(b['Date'] || '');
    return db.localeCompare(da);
  });

  const totalPages = Math.ceil(sorted.length / PAGE_SIZE);
  const page = Math.min(STATE.purchaseLogPage, Math.max(0, totalPages - 1));
  STATE.purchaseLogPage = page;
  const startIdx = page * PAGE_SIZE;
  const displayRows = sorted.slice(startIdx, startIdx + PAGE_SIZE);

  return `
    <div class="purchase-log">
      <div class="purchase-log-header" style="cursor:default;">
        <div class="purchase-log-title">
          Purchase Log
          <span style="font-family:var(--font-body);font-size:12px;font-weight:400;opacity:0.5;">${sorted.length} entries</span>
        </div>
      </div>
      ${sorted.length === 0 ? `
        <div class="purchase-log-empty">No purchase data yet. Click "+ Log Purchase" to add entries.</div>
      ` : `
        <div style="overflow-x:auto;">
          <table class="purchase-log-table">
            <thead>
              <tr>
                <th>Date</th>
                ${productNames.map(n => `<th>${escapeHtml(n)}</th>`).join('')}
                <th>Units</th>
                <th>Revenue</th>
                <th class="action-col"></th>
              </tr>
            </thead>
            <tbody>
              ${displayRows.map(row => {
                const totalUnits = parseNum(row['Total Units'] || '0');
                const totalRevenue = parseNum(row['Total Revenue'] || '0');
                const dateVal = row['Date'] || '';
                const displayDate = formatDisplayDate(dateVal);
                const safeOffer = escapeAttr(offerName);
                const safeDate = escapeAttr(dateVal);

                return `<tr>
                  <td>${displayDate}</td>
                  ${productNames.map(n => {
                    const qty = parseNum(row[n] || '0');
                    return `<td>${qty > 0 ? qty : '<span style="opacity:0.2;">0</span>'}</td>`;
                  }).join('')}
                  <td class="total-col">${totalUnits}</td>
                  <td class="revenue-col">${formatCurrency(totalRevenue)}</td>
                  <td class="action-col">
                    <button class="pl-row-btn" title="Edit" onclick="openEditPurchase('${safeOffer}','${safeDate}')">✏</button>
                    <button class="pl-row-btn delete" title="Delete" onclick="deletePurchaseRow('${safeOffer}','${safeDate}')">✕</button>
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
        ${totalPages > 1 ? `
          <div style="display:flex;align-items:center;justify-content:center;gap:16px;padding:12px 24px;border-top:1px solid var(--ksa-border);">
            <button class="small-btn small-btn-outline" onclick="changePurchaseLogPage(-1)" ${page === 0 ? 'disabled style="opacity:0.3;pointer-events:none;"' : ''}>&#8592; Prev</button>
            <span style="font-family:var(--font-body);font-size:13px;color:var(--ksa-text);">
              Page ${page + 1} of ${totalPages}
            </span>
            <button class="small-btn small-btn-outline" onclick="changePurchaseLogPage(1)" ${page >= totalPages - 1 ? 'disabled style="opacity:0.3;pointer-events:none;"' : ''}>Next &#8594;</button>
          </div>
        ` : ''}
      `}
    </div>
  `;
}

function openEditPurchase(offerName, rawDate) {
  const slug = STATE.activeClient.slug;
  const data = STATE.cache[slug];
  if (!data) return;

  const configProducts = (data.config || [])
    .filter(c => c['Offer Name'] === offerName && c['Active'] !== 'No')
    .sort((a, b) => parseInt(a['Position'] || 0) - parseInt(b['Position'] || 0));

  // Find the row by raw date value
  const row = (data.purchases[offerName] || []).find(r => r['Date'] === rawDate);
  if (!row) { showToast('Could not find that purchase entry'); return; }

  const productFields = configProducts.map(p => {
    const ptype = productType(p);
    const pname = productDisplayName(p);
    const labelText = pname ? `${ptype} — ${pname}` : ptype;
    const currentQty = parseNum(row[ptype] || '0');
    return `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
      <div style="font-size:13px;flex:1;font-family:var(--font-body);">${escapeHtml(labelText)}</div>
      <input type="number" min="0" step="1" value="${currentQty}"
             style="width:70px;padding:6px 8px;border:1px solid var(--ksa-border);border-radius:6px;font-family:var(--font-body);font-size:14px;text-align:center;"
             data-pe-product="${escapeAttr(ptype)}"
             data-pe-price="${parseNum(p['Current Price'])}"
             oninput="updatePurchaseModalTotals()">
    </div>`;
  }).join('');

  // Display a friendly date label
  const normDate = normalizeDateStr(rawDate);
  const displayDate = normDate ? normDate.replace(/^(\d{4})-(\d{2})-(\d{2})$/, '$2/$3/$1') : rawDate;

  const html = `
    <div class="modal-title">Edit Purchase Entry</div>
    <p style="font-family:var(--font-body);font-size:13px;margin:0 0 16px;opacity:0.5;">${escapeHtml(offerName)} &middot; ${displayDate}</p>
    ${productFields}
    <div style="display:flex;gap:24px;padding:10px 0 16px;border-top:1px solid var(--ksa-border);margin-top:6px;font-family:var(--font-body);font-size:13px;">
      <div>Units: <strong id="pe-total-units">0</strong></div>
      <div>Est. Revenue: <strong id="pe-total-revenue">$0</strong></div>
    </div>
    <div class="modal-actions">
      <button class="ksa-btn-outline" onclick="closeModal()">Cancel</button>
      <button class="ksa-btn" onclick="submitEditPurchase('${escapeAttr(offerName)}','${escapeAttr(rawDate)}')">Save Changes</button>
    </div>
  `;

  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
  updatePurchaseModalTotals();
}

async function submitEditPurchase(offerName, rawDate) {
  const inputs = document.querySelectorAll('[data-pe-product]');
  const quantities = {};
  let totalUnits = 0;
  let totalRevenue = 0;

  inputs.forEach(input => {
    const ptype = input.dataset.peProduct;
    const price = parseFloat(input.dataset.pePrice) || 0;
    const qty = parseInt(input.value) || 0;
    if (qty > 0) quantities[ptype] = qty;
    totalUnits += qty;
    totalRevenue += qty * price;
  });

  // Send the normalized date so Apps Script can match it
  const normalizedDate = normalizeDateStr(rawDate) || rawDate;

  const result = await postToWebApp('save_purchases', {
    clientSlug: STATE.activeClient.slug,
    offerName,
    date: normalizedDate,
    quantities,
    totalUnits,
    totalRevenue
  });

  if (!result) return;
  closeModal();
  await fetchClientData(STATE.activeClient.slug);
  renderOfferView();
}

async function deletePurchaseRow(offerName, rawDate) {
  const normDate = normalizeDateStr(rawDate);
  const displayDate = normDate ? normDate.replace(/^(\d{4})-(\d{2})-(\d{2})$/, '$2/$3/$1') : rawDate;

  // Simple inline confirm via modal
  const html = `
    <div class="modal-title">Delete Entry?</div>
    <p style="font-family:var(--font-body);font-size:14px;margin:0 0 20px;">
      Remove the purchase entry for <strong>${escapeHtml(displayDate)}</strong> from <strong>${escapeHtml(offerName)}</strong>?
      This cannot be undone.
    </p>
    <div class="modal-actions">
      <button class="ksa-btn-outline" onclick="closeModal()">Cancel</button>
      <button class="ksa-btn" style="background:#E05050;" onclick="confirmDeletePurchase('${escapeAttr(offerName)}','${escapeAttr(rawDate)}')">Delete</button>
    </div>
  `;
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

async function confirmDeletePurchase(offerName, rawDate) {
  closeModal();
  const normalizedDate = normalizeDateStr(rawDate) || rawDate;

  const result = await postToWebApp('delete_purchase', {
    clientSlug: STATE.activeClient.slug,
    offerName,
    date: normalizedDate
  });

  if (!result) return;
  await fetchClientData(STATE.activeClient.slug);
  renderOfferView();
}

function togglePurchaseLog() {
  const body = document.getElementById('pl-body');
  const arrow = document.getElementById('pl-arrow');
  const isOpen = body.classList.contains('open');
  if (isOpen) {
    body.classList.remove('open');
    arrow.classList.remove('open');
  } else {
    body.classList.add('open');
    arrow.classList.add('open');
  }
}

function changePurchaseLogPage(delta) {
  STATE.purchaseLogPage += delta;
  renderOfferView();
}

// ============================================================
// LOG PURCHASE MODAL
// ============================================================

function openAddIGPurchase(offerName) {
  const today = new Date().toISOString().split('T')[0];
  const html = `
    <div class="modal-title">Add Purchase</div>
    <div class="modal-label">Date</div>
    <input class="modal-input" id="ig-purchase-date" type="date" value="${today}">
    <div class="modal-label">Description</div>
    <input class="modal-input" id="ig-purchase-desc">
    <div class="modal-label">Revenue</div>
    <input class="modal-input" id="ig-purchase-revenue" type="number" step="0.01" min="0.01" placeholder="0.00">
    <div class="modal-actions">
      <button class="ksa-btn-outline" onclick="closeModal()">Cancel</button>
      <button class="ksa-btn" onclick="submitIGPurchase('${escapeAttr(offerName)}')">Add Purchase</button>
    </div>`;
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

async function submitIGPurchase(offerName) {
  const slug = STATE.activeClient.slug;
  const date = document.getElementById('ig-purchase-date').value;
  const description = document.getElementById('ig-purchase-desc').value.trim();
  const revenue = parseFloat(document.getElementById('ig-purchase-revenue').value) || 0;
  if (!date) { showToast('Please enter a date.', true); return; }
  if (revenue <= 0) { showToast('Please enter a revenue amount.', true); return; }
  closeModal();
  showToast('Saving purchase...');
  const res = await postToWebApp('log_ig_purchase', { clientSlug: slug, date, description, revenue });
  if (res && res.success) {
    await fetchClientData(slug);
    renderOfferView();
    showToast('Purchase added.');
  } else {
    showToast('Error saving purchase.', true);
  }
}

function confirmDeleteIGPurchase(slug, rowIndex) {
  const data = STATE.cache[slug];
  if (!data) return;
  const sorted = [...(data.igPurchases || [])].sort((a, b) =>
    normalizeDateStr(b['Date'] || '').localeCompare(normalizeDateStr(a['Date'] || ''))
  );
  const row = sorted[rowIndex];
  if (!row) return;
  const dateLabel = formatDisplayDate(row['Date'] || '');
  const descLabel = row['Description'] ? ` &mdash; ${escapeHtml(row['Description'])}` : '';
  const html = `
    <div class="modal-title">Delete Purchase</div>
    <p style="font-size:15px;color:var(--ksa-text);margin:0 0 8px;line-height:1.5;">
      Delete the <strong>${dateLabel}</strong>${descLabel} entry?
    </p>
    <p style="font-size:13px;color:#999;margin:0 0 24px;">This can't be undone.</p>
    <div class="modal-actions">
      <button class="ksa-btn-outline" onclick="closeModal()">Cancel</button>
      <button class="ksa-btn" style="background:#e05454;border-color:#e05454;" onclick="executeDeleteIGPurchase('${escapeAttr(slug)}', ${rowIndex})">Delete</button>
    </div>`;
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

async function executeDeleteIGPurchase(slug, rowIndex) {
  const data = STATE.cache[slug];
  if (!data) return;
  closeModal();
  const sorted = [...(data.igPurchases || [])].sort((a, b) =>
    normalizeDateStr(b['Date'] || '').localeCompare(normalizeDateStr(a['Date'] || ''))
  );
  const row = sorted[rowIndex];
  if (!row) return;
  const res = await postToWebApp('delete_ig_purchase', {
    clientSlug: slug,
    date: normalizeDateStr(row['Date'] || ''),
    description: row['Description'] || '',
    revenue: parseNum(row['Revenue'] || '0')
  });
  if (res && res.success) {
    await fetchClientData(slug);
    renderOfferView();
    showToast('Purchase deleted.');
  } else {
    showToast('Error deleting purchase.', true);
  }
}

function openLogPurchaseModal(offerName) {
  const slug = STATE.activeClient.slug;
  const data = STATE.cache[slug];
  if (!data) return;

  const configProducts = (data.config || [])
    .filter(c => c['Offer Name'] === offerName && c['Active'] !== 'No')
    .sort((a, b) => parseInt(a['Position'] || 0) - parseInt(b['Position'] || 0));

  if (configProducts.length === 0) {
    showToast('No products configured for this offer');
    return;
  }

  const productFields = configProducts.map(p => {
    const ptype = productType(p);
    const pname = productDisplayName(p);
    const labelText = pname ? `${escapeHtml(ptype)} — ${escapeHtml(pname)}` : escapeHtml(ptype);
    return `
    <div class="pe-modal-field">
      <label>${labelText}</label>
      <input type="number" min="0" step="1" value="0"
             data-pe-product="${escapeAttr(ptype)}"
             data-pe-price="${parseNum(p['Current Price'])}"
             oninput="updatePurchaseModalTotals()">
    </div>
  `;
  }).join('');

  const html = `
    <div class="modal-title">Log Purchases — ${escapeHtml(offerName)}</div>

    <div class="modal-label">Date</div>
    <input class="modal-input" id="pe-date" type="date" value="${dateStr(new Date())}">

    <div class="pe-modal-grid">
      ${productFields}
    </div>

    <div class="pe-modal-totals">
      <div class="pe-modal-total-item">
        <span class="pe-modal-total-label">Total Units</span>
        <span class="pe-modal-total-value" id="pe-total-units">0</span>
      </div>
      <div class="pe-modal-total-item">
        <span class="pe-modal-total-label">Total Revenue</span>
        <span class="pe-modal-total-value" id="pe-total-revenue">$0</span>
      </div>
    </div>

    <div class="modal-actions">
      <button class="ksa-btn-outline" onclick="closeModal()">Cancel</button>
      <button class="ksa-btn" onclick="submitPurchases('${escapeAttr(offerName)}')">Save</button>
    </div>
  `;

  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

function updatePurchaseModalTotals() {
  const inputs = document.querySelectorAll('[data-pe-product]');
  let totalUnits = 0;
  let totalRevenue = 0;

  inputs.forEach(input => {
    const qty = parseInt(input.value) || 0;
    const price = parseFloat(input.dataset.pePrice) || 0;
    totalUnits += qty;
    totalRevenue += qty * price;
  });

  const unitsEl = document.getElementById('pe-total-units');
  const revenueEl = document.getElementById('pe-total-revenue');
  if (unitsEl) unitsEl.textContent = totalUnits;
  if (revenueEl) revenueEl.textContent = formatCurrency(totalRevenue);
}

async function submitPurchases(offerName) {
  if (!STATE.activeClient) return;

  const dateInput = document.getElementById('pe-date');
  const date = dateInput ? dateInput.value : dateStr(new Date());
  if (!date) { showToast('Please select a date'); return; }

  const inputs = document.querySelectorAll('[data-pe-product]');
  const quantities = {};
  let totalUnits = 0;
  let totalRevenue = 0;

  inputs.forEach(input => {
    const productName = input.dataset.peProduct;
    const qty = parseInt(input.value) || 0;
    const price = parseFloat(input.dataset.pePrice) || 0;
    quantities[productName] = qty;
    totalUnits += qty;
    totalRevenue += qty * price;
  });

  const result = await postToWebApp('save_purchases', {
    clientSlug: STATE.activeClient.slug,
    offerName,
    date,
    quantities,
    totalUnits,
    totalRevenue
  }, true); // silent — custom toast below

  if (result) {
    closeModal();
    await fetchClientData(STATE.activeClient.slug);
    renderOfferView();
    showToast('Purchases saved for ' + date);
  }
}

// ============================================================
// UTILITY
// ============================================================

function formatCurrency(val) {
  if (val === undefined || val === null || isNaN(val)) return '$0';
  const neg = val < 0;
  const abs = Math.abs(val);
  let formatted;
  if (abs >= 10000) {
    formatted = '$' + (abs / 1000).toFixed(1) + 'k';
  } else if (abs >= 1000) {
    formatted = '$' + abs.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  } else {
    formatted = '$' + abs.toFixed(abs < 10 ? 2 : 0);
  }
  return neg ? '-' + formatted : formatted;
}

function formatShort(val) {
  if (Math.abs(val) >= 1000) return (val / 1000).toFixed(1) + 'k';
  if (Math.abs(val) >= 1) return val.toFixed(0);
  return val.toFixed(2);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function escapeAttr(str) {
  return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function hashStr(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash).toString(36);
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ============================================================
// INIT
// ============================================================

async function loadConfig() {
  try {
    const res = await fetch(WEBAPP_URL);
    if (!res.ok) throw new Error('Config fetch failed');
    const cfg = await res.json();
    SHEET_ID = cfg.SHEET_ID || '';
    API_KEY = cfg.API_KEY || '';
    WEBAPP_SECRET = cfg.WEBAPP_SECRET || '';
  } catch (err) {
    console.error('Failed to load config:', err);
    showToast('Failed to load dashboard config. Check Apps Script deployment.', true);
  }
}

async function init() {
  await loadConfig();
  if (!SHEET_ID || !API_KEY) {
    showToast('Missing config — check Apps Script properties.', true);
    return;
  }
  await fetchClients();
  // Auto-select the first client so the dashboard loads with data right away
  if (STATE.clients.length > 0 && !STATE.activeClient) {
    await selectClient(STATE.clients[0].slug);
  }
  updateSyncTime();
}

init();
